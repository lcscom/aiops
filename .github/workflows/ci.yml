name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 의존성 설치
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: 문법 검사(정적 JS)
        run: for f in app/static/*.js; do node --check "$f"; done
      - name: 테스트
        run: python -m pytest -q
