# VCF AIops 설정 — config.yaml 로 복사 후 수정
# 비밀번호는 ${ENV_VAR} 로 참조 권장 (.env / docker-compose environment)

server:
  host: 0.0.0.0
  port: 8630                   # 웹 대시보드 + REST/WebSocket API 단일 포트
  db_path: data/aiops.db
  buffer_size: 5000            # 메모리 실시간 버퍼(줄)
  retention_days: 7            # SQLite 보존 기간
  tls:                         # HTTPS 직접 서빙 (scripts\windows\export-cert.ps1 로 Windows 인증서 → PEM)
    enabled: auto              # auto: 아래 파일이 있으면 HTTPS / true / false
    certfile: certs/aiops.crt
    keyfile: certs/aiops.key
  trusted_proxies: 127.0.0.1   # IIS ARR 등 리버스 프록시 뒤에 둘 때
  access_log: false            # 운영 기본 off (폴링·정적 요청 로그 I/O 절감)
  log_level: info
  public_url: https://aiops.vcf.lab:8630   # ITSM 티켓·알림의 인시던트 링크(#incident/ID) 기준 주소
  # external_hosts: [aiops.krvcf.com]       # (2.21.2) 외부 공개 이름(Cloudflare Tunnel 등) — 이 이름으로 온 요청은 아래 내부 연동 경로 404
  # external_block_paths: [/agents, /api/redfish/events/, /api/ha/peer, /api/ingest, /metrics, /mcp, /api/docs, /api/openapi.json]
  # cf_access: {team_domain: myteam.cloudflareaccess.com, aud: <Access 앱 AUD 태그>, enforce: true}   # (2.22.0) 외부 이름 요청의 Access JWT 원본 검증 — tunnel --access-allow 가 자동 기록
  ws_queue: 2000               # 화면(WebSocket)별 송신 대기 상한 — 넘치면 그 화면만 끊고 재접속·재동기화(다른 화면·수집 영향 없음)
  ws_send_timeout: 15          # 송신 1건 상한(초) — 죽은 TCP 정리
  ws_idle_timeout: 0           # >0 이면 앱 메시지 무수신 상한(초). 0 = 프로토콜 ping/pong(ws_ping_interval 20초)으로만 정리

# ---------------------------------------------------------------- 실시간 처리·안정성
pipeline:                      # 수집 → 처리 큐(비차단). 우선 = 경고 이상·알람·플랫폼 이벤트·(적체 시) 위험 키워드 포함 로그
  high_queue: 20000
  low_queue: 100000            # 90% 이상 차면 수신기가 파싱 전에 info 원문을 버림(우선 로그는 계속 처리) → 플랫폼 경고
  classify_backlog: 500
  context_hosts: 5000
storage:
  log_queue: 100000            # DB write-behind 버퍼(원본 로그)
  min_free_mb: 1024            # 디스크 여유가 이 아래면 원본 로그 저장 중지(이상징후·감사는 계속) → 플랫폼 장애
  query_timeout_s: 20          # (2.30.0) 화면·API 조회 한 건의 상한(초) — 넘으면 중단하고 504(다른 조회가 함께 멈추지 않게). 0 = 무제한
  late_index_delay_s: 30       # (2.30.0) 큰 테이블의 보조 인덱스를 기동 후 이만큼 지나 뒤에서 만듦(기동을 막지 않음)
health:                        # 플랫폼 자체 감시(5초) — 상태 변화 시 source=aiops 이상징후·알림, 정상화 시 자동 확인
  loop_lag_warn_ms: 500
  loop_lag_crit_ms: 2000
  ready_lag_ms: 5000           # /readyz 503 기준(이벤트 루프 p99)
  pipeline_lag_warn_s: 30
  outbox_delay_warn_s: 600
ha:                            # 2노드 이중화 — 둘 다 수집·화면 운영, 외부 알림·ITSM·리포트 메일은 리더만
  enabled: false
  role: primary                # primary | standby
  node_name: ""                # 비우면 호스트명
  peer_url: ""                 # 예) https://aiops-02.vcf.lab:8630
  shared_secret: ${AIOPS_HA_SECRET}   # 두 노드 동일 값(HMAC-SHA256)
  failover_seconds: 30         # standby: primary 응답 없음/not ready 지속 시 리더 인계
  failback_seconds: 60         # standby: primary 정상 지속 시 리더 반납
  check_interval: 5
  verify_tls: false

# ---------------------------------------------------------------- AI 분석 엔진
# VMware Private AI Services 모델 엔드포인트(OpenAI 호환) 또는 vLLM 직접 지정
llm:
  enabled: true
  base_url: ${PAIS_BASE_URL:-https://pais.vcf.lab/v1}   # /chat/completions 앞까지 (끝에 /v1 포함)
  api_key: ${PAIS_API_KEY}
  model: google/gemma-4-31B-it                          # /v1/models 의 id 와 정확히 일치해야 함
  verify_tls: false
  timeout: 120
  max_tokens: 1200
  temperature: 0.1
  batch_size: 6              # 한 번에 판정할 이상 후보 수
  batch_interval: 5          # 배치 대기 최대 초
  json_mode: true            # response_format=json_object (미지원 시 자동 해제)
  context_lines: 12          # 후보별 동일 호스트 직전 로그 동봉 줄 수
  breaker_threshold: 3       # 연속 실패 시 LLM 호출 일시 차단 → 새 이상징후는 규칙 탐지로 즉시 처리
  breaker_reset: 60          # 차단 후 재시험까지(초)
  extra_body: {}             # 예) {chat_template_kwargs: {enable_thinking: false}}
  analysis_enabled: true     # 자동 AI 분석(화면 머리글 'AI 분석' 스위치와 같음)
  # 위 base_url/model 은 'local' 공급자. 추가 공급자(화면: 운영 설정 › AI 분석에서도 편집 가능):
  # providers:
  #   - {name: claude, type: anthropic, api_key: "${ANTHROPIC_API_KEY}", model: claude-haiku-5-5}
  #   - {name: gemini, type: gemini, api_key: "${GEMINI_API_KEY}", model: gemini-3.5-flash-lite}
  # routing: {analyze: local, rca: claude, chat: claude, brief: local, report: local}   # 작업별 공급자
  fallback: true             # 실패 시 다음 공급자
  external_mask: true        # 외부 API 전송 시 IP·호스트명 가명화(응답에서 복원)
  # internal_suffixes: [corp.example.co.kr]   # (2.30.0) external 을 적지 않은 openai 유형 공급자를 '사내'로 볼 도메인 접미사.
  #                            사설 IP·localhost·.lab/.local/.internal 등은 기본으로 사내. 그 밖의 주소는 외부로 보고 가명화 + TLS 검증
  pattern_reuse: true        # 같은 로그 패턴은 한 번만 분석하고 결과 재사용
  pattern_ttl_hours: 168     # 재사용 기간
  governor:                  # GPU 발열·호출량 조절(자동 분석)
    min_interval: 5          # 호출 간 최소 간격(초)
    max_calls_per_hour: 120  # 공급자당 시간당 최대(0=무제한)
    gpu_metrics_url: ""      # DCGM exporter, 예) http://gpu-node:9400/metrics
    temp_pause: 80           # 이 온도 이상이면 자동 분석 일시 중지(°C)
    temp_resume: 72          # 이 온도 이하로 내려오면 재개
    vllm_metrics_url: ""     # 예) http://pais:8000/metrics
    vllm_waiting_max: 4

# ---------------------------------------------------------------- 1차 탐지
detection:
  llm_threshold: 0.5         # 0~1, 낮출수록 LLM 호출 증가
  warmup_seconds: 300        # 기동 후 신규 패턴/급증 판정 보류 시간
  burst_z: 3.5
  burst_min_count: 15
  dedupe_window: 600         # 같은 지문(소스+대상+템플릿) 재발은 카운트만 증가
  suppress:                  # 노이즈 억제 정규식
    - "vob.user.vmsyslogd.remote.reconnected"
  extra_rules:               # 사내 규칙 추가
    - {name: core_bank_db, pattern: "core-bank-db.*(down|fail)", category: vm, severity: critical, weight: 0.95}

# ---------------------------------------------------------------- 알림
alerting:
  outbox_keep_days: 14         # (2.30.0) 발송 완료·대기 생략 기록 보존(일) · outbox_dead_keep_days: 90(끝내 실패한 기록)
  min_severity: error        # 이 등급 이상만 알림
  cooldown: 900              # 동일 지문 재알림 최소 간격(초)
  require_llm_confirm: false # true면 Gemma 판정(is_anomaly=true) 후에만 발송
  critical_immediate: true   # 위험(critical)은 LLM 을 기다리지 않고 즉시 인시던트·알림(AI 결과는 이후 보강)
  llm_wait_seconds: 30       # 그 외 등급의 LLM 판정 대기 상한(초과 시 규칙 탐지 결과로 진행)
  max_attempts: 8            # 웹훅·메일 재시도 횟수 — 초과 시 '발송 실패함'(플랫폼 상태 화면에서 재발송)
  retry_schedule: [30, 120, 300, 900, 1800, 3600]
  channel_breaker_reset: 60  # 채널 3회 연속 실패 시 발송 보류 시간(재시도 횟수 소모 방지)
  webhooks:
    # - {name: slack-noc, format: slack, url: "${SLACK_WEBHOOK}"}
    # - {name: teams-infra, format: teams, url: "${TEAMS_WEBHOOK}"}
    # - {name: sms-gw, format: generic, url: "http://192.168.0.50:8080/alert", headers: {X-Token: "${SMS_TOKEN}"}}
    # - {name: pagerduty-infra, format: pagerduty, secret: "${PD_ROUTING_KEY}"}     # Events API v2 — dedup_key=이상징후 id
    # - {name: opsgenie-noc, format: opsgenie, secret: "${OPSGENIE_API_KEY}"}       # Alert API — alias=이상징후 id, P1~P5 매핑
  routes:                            # 라우팅(2.2) — 위에서부터 첫 일치, 비우면 전 채널
    # - {name: 야간-위험, severities: [critical], hours: "18:00-09:00", channels: [pagerduty-infra, smtp]}
    # - {name: 네트워크, sources: [arista, cisco], channels: [teams-infra]}
  default_channels: []               # 어느 규칙에도 안 맞을 때(비우면 전 채널)
  smtp:
    enabled: false
    host: smtp.example.com
    port: 587
    starttls: true
    username: ${SMTP_USER}
    password: ${SMTP_PASS}
    from: aiops@example.com
    to: [noc@example.com]

# ---------------------------------------------------------------- 푸시 수집
syslog:                      # ESXi·vCenter·NSX(Manager/Edge)·SRM·VCF Ops·Supervisor·VKS(Fluent Bit)·VM 게스트 → syslog
  enabled: true
  bind: 0.0.0.0
  udp_port: 514
  tcp_port: 514
  tls:                         # RFC5425 TLS 수신 — 인증서 파일이 있으면 자동(auto)
    enabled: auto
    port: 6514
    certfile: certs/aiops.crt
    keyfile: certs/aiops.key
    # ca_file: certs/corp-root-ca.pem   # NSX exporter 를 TLS 로 적용할 때 tls_ca_pem 으로 전달
  advertise_host: aiops.vcf.lab        # 장비가 로그를 보낼 이 서버 주소 — '로그 전송 설정' 점검·적용 기준
  advertise_protocol: udp              # udp | tcp | tls
  host_map:                    # (선택) 호스트명/송신 IP 정규식 → 소스 강제 분류
    - {match: "^wld-bank01-", source: vks}
    # - {match: "^10\\.10\\.50\\.", source: vks-supervisor}
snmp:                        # SNMP 트랩 수신 (v1 / v2c / v3)
  enabled: true
  bind: 0.0.0.0
  port: 162
  communities: [public]      # v1/v2c 허용 커뮤니티
  v3_users:                  # v3 트랩은 송신 장비의 engineID가 필요 (ESXi: esxcli system snmp get)
    # - {user: aiops, auth_protocol: SHA256, auth_key: "${SNMP_AUTH_KEY}", priv_protocol: AES, priv_key: "${SNMP_PRIV_KEY}", engine_id: "80001adc05..."}
  hosts:                     # 송신 IP → 표시 이름/소스 고정(선택)
    # - {ip: 10.10.0.21, name: esx01.vcf.lab, source: esxi}
    # - {ip: 10.10.9.11, name: ilo-esx01, source: redfish}
  oid_map:                   # 내장 사전에 없는 벤더/사내 트랩 등록 (화면 'SNMP 트랩' 탭의 미등록 OID 참고)
    # "1.3.6.1.4.1.232.0.6014": {name: cpqHe3PowerSupplyFailed, severity: critical, source: redfish}
    # "1.3.6.1.4.1.232.6.2.9.3.1.4": {name: cpqHeFltTolPowerSupplyCondition, trap: false}   # 변수 이름만 등록
ingest:                      # HTTP 수집: POST /api/ingest (Fluent Bit http output 등)
  enabled: true
  token: ${INGEST_TOKEN}       # (호환용 공유 토큰) 권장: 화면 '사용자·토큰'에서 scope=ingest API 토큰 발급 — 송신처별 발급·폐기·만료 관리
  max_body_mb: 32              # 요청 1건 상한(gzip 해제 전)

# ---------------------------------------------------------------- VM 게스트·물리 서버 OS 로그 에이전트
# 콘솔 › VM·서버 에이전트 › 에이전트 등록 → Linux(Fluent Bit·rsyslog)·Windows(Fluent Bit) 설치 명령 생성
isvara:                      # Isvara(isvara.io) iO — VCF·vSphere·vSAN 성능 가이드 근거 Q&A(MCP: https://isvara.io/api/mcp)
  enabled: false             # 외부 전송(질문 문장만). 망분리면 끔 유지 또는 사내 프록시 경유
  url: https://isvara.io/api/mcp
  proxy: ""                  # 예: http://proxy.corp.example:8080
  timeout: 20
  chat_grounding: true       # AI 질의에서 성능 관련 질문이면 iO 답변을 근거 [I1] 로 첨부

agents:
  stale_seconds: 300           # 로그·하트비트(60초) 모두 이 시간 없으면 '에이전트 무응답' 경보(복구 시 자동 확인)
  alert_on_stale: true
  public_url: ""               # 에이전트·BMC(Redfish push)가 접속할 주소(비우면 server.public_url) — VIP·NAT 뒤라면 지정

# ---------------------------------------------------------------- 제품별 RAG 팩
# 대시보드 'RAG 팩' 메뉴에서 .ragpack 가져오기 → 활성화. 활성 팩은 applies_to 소스의 이상 분석·AI 질의에 근거로 주입
rag:
  enabled: true
  top_k: 5
  min_score: 0.3
  dense_weight: 0.6              # Dense(임베딩) vs BM25 가중
  max_chars_per_ref: 1200
  embedding:                     # 팩 벡터 생성·질의 임베딩 (OpenAI 호환 /v1/embeddings)
    enabled: true
    base_url: ${EMBED_BASE_URL:-https://pais.vcf.lab/v1}
    api_key: ${PAIS_API_KEY}
    model: BAAI/bge-m3           # 팩 manifest.embedding.model 과 같으면 재임베딩 없이 사용
    verify_tls: false

# ---------------------------------------------------------------- KB·TechDocs 지식 라이브러리(app/knowledge.py)
# Broadcom KB·TechDocs 를 Markdown 으로 수집한 아카이브를 색인해 AI 분석·질의·관제 개체 상세의 근거로 쓴다.
# 화면: 좌측 '지식(KB·문서)' — md 묶음(zip) 업로드·색인 상태·검색 시험·지식 공백 / 운영 설정 › 지식(KB·문서)
# 형식 점검: python -m app.knowledge inspect <폴더> --n 10
knowledge:
  enabled: true
  paths: []                    # 예) [/mnt/kb-archive/broadcom-kb, /mnt/kb-archive/techdocs] — 하위 폴더 전체, 증분 색인
  scan_interval: 21600         # 증분 색인 주기(초) — 24시간 수집기가 갱신한 파일만 다시 파싱
  embed: true                  # rag.embedding 이 켜져 있으면 청크 벡터(하이브리드 검색)
  top_k: 4
  min_relevance: 0.4
  max_chars_per_ref: 2400      # 문서 1건(증상·원인·해결·우회 묶음)이 AI 에 들어가는 최대 글자
  chunk_size: 1600
  chunk_overlap: 150
  max_file_mb: 8
  max_upload_gb: 4
  vendors: [vmware]            # 우선 사업부(front matter vendor) — ca·symantec·other(Converter 등 VMware 제품 제외)는 순위 낮춤
  languages: [en, ko]          # 일본어 번역본(같은 KB의 ja)은 순위 낮춤
  skip_dirs: []                # 추가 제외 폴더명(_catalog·_changes·_rag 처럼 _·. 로 시작하는 폴더는 항상 제외)
  auto_link: true              # 근거 없이 판정된 이상징후·인시던트에 비슷한 KB 를 자동 연결(지식이 바뀌면 다시 찾음, LLM 호출 없음)
  link_interval: 20
  link_min_relevance: 0.6
  link_top_k: 3
  chat_min_rel: 0.5            # (2.6.1) AI 질의 근거로 쓰는 라이브러리 문서의 최소 관련도(질의어 일치율·의미 유사도·오류 문구 일치)
  chat_min_pack_score: 0.3     # (2.6.1) RAG 팩 문서 최소 점수

# ---------------------------------------------------------------- VM 사용량 정산(app/billing.py)
# 화면: 좌측 '정산(Billing)' — 테넌트·프로젝트(클러스터·폴더·태그·VM 매칭)·요율표·기간 보고서·CSV·명세서
# vCenter 인벤토리를 5분마다 표본으로 남겨 시간 단위로 누적(VM 폴더·태그는 읽기 전용 계정으로 수집)
billing:
  enabled: true
  retention_days: 400
  currency: KRW

# ---------------------------------------------------------------- 용량 계획·VM 적정화(app/capacity.py)
# 화면: 좌측 '용량·적정화' — 클러스터 CPU/메모리·데이터스토어 추세(80%/90% 도달 예상일), 과다·과소·유휴·장기 꺼짐 VM 과 절감 추정
capacity:
  enabled: true
  forecast_days: 30
  rightsizing_days: 14
  retention_days: 400
  oversized_cpu_pct: 25        # 피크 CPU 가 이 값 미만(vCPU 4 이상)이면 과다
  oversized_mem_pct: 30
  undersized_cpu_pct: 75       # 평균 CPU 가 이 값 이상이면 과소
  undersized_mem_pct: 85
  idle_cpu_pct: 3              # 피크 CPU·메모리가 모두 이 값 미만이면 유휴
  idle_mem_pct: 10
  headroom: 1.5                # 권장 크기 = 피크 × 여유
  powered_off_days: 7          # 이보다 오래 꺼진 VM 은 정리 후보

# ---------------------------------------------------------------- 보안 판독(app/assess.py)
# 화면: 좌측 '보안 판독' — ESXi·vCenter 하드닝, KISA 가상화(HV-01~25) 대응표, VMSA/CVE 버전 판독, CSV·인쇄 보고서
# 수집은 읽기 전용(설정 변경 없음). 취약점 목록은 NVD CVE API 2.0 동기화 또는 JSON 가져오기(폐쇄망)
assessment:
  enabled: true
  interval_hours: 24
  max_vms: 500
  snapshot_days: 3
  nvd:
    enabled: false             # 켜면 services.nvd.nist.gov 로 제품 CPE 조회(외부 통신)
    url: https://services.nvd.nist.gov/rest/json/cves/2.0
    api_key: ""                # NVD API 키(선택, 요청 간격 6초 → 0.6초)
    proxy: ""                  # 예: http://proxy.corp.example:8080
    interval_days: 7

# ---------------------------------------------------------------- 수집 현황 감시
# 대시보드 '수집 현황'에서 항목별 수신 여부를 판정. 중단·미수신 전환 시 알림(수집 중단: …)
monitoring:
  active_window: 300           # 5분 내 수신 → '수집 중'
  alert_on_stop: true
  max_silence:                 # 이 시간 이상 무수신이면 '중단' (0 = 감시 안 함, 트랩처럼 간헐적인 경우)
    syslog: 900                # ESXi·vCenter·NSX syslog 는 상시 발생 → 15분
    ingest: 900
    snmp: 0
    vcflogs: 600
  expected:                    # 반드시 들어와야 하는 장비 — 한 번도 안 들어오면 '미수신'
    # - {name: "ESXi 관리 클러스터", kind: syslog, match: "^esx0[1-4]\\.vcf\\.lab$", max_silence: 600}
    # - {name: "NSX Edge", kind: syslog, match: "nsx-edge", max_silence: 900}
    # - {name: "iLO 트랩", kind: snmp, match: "10\\.10\\.9\\.", max_silence: 86400}

demo:
  enabled: false             # true 또는 AIOPS_DEMO=1 → 합성 로그 생성
  rate: 4

# ---------------------------------------------------------------- 인증 · 권한 · 감사
# 역할: viewer(조회) · auditor(조회+감사로그) · operator(처리·조치 요청) · admin(설정·승인·사용자)
# 최초 기동 시 로컬 관리자 'admin' 생성 → 초기 비밀번호는 data/initial-admin.txt (또는 AIOPS_ADMIN_PASSWORD 환경변수)
auth:
  enabled: true
  session_idle_minutes: 10           # 사용자 입력 기준 유휴 만료(백그라운드 폴링은 제외)
  session_absolute_hours: 12
  single_session: false              # true: 같은 계정 동시접속 시 이전 세션 종료
  lockout_threshold: 5               # 연속 실패 시 잠금
  show_remaining_attempts: false     # (2.21.2) 실패 시 '남은 시도 N회' 표시 — 외부 공개 시 계정 존재 여부 추정 방지로 기본 숨김
  lockout_minutes: 30
  dormant_days: 90                   # 장기 미사용 계정 자동 잠금(관리자 제외, 0=사용 안 함)
  login_banner: "본 시스템은 인가된 사용자만 사용할 수 있으며 모든 접속·조작 기록은 감사 목적으로 저장됩니다."
  password: {min_length: 9, classes: 3, expire_days: 90, history: 3}
  kiosk_users: [noc-wall]            # 통합 관제(/noc) 월 디스플레이 전용 계정 — 유휴 만료 없음, 조회자 권한 고정
  kiosk_absolute_hours: 168          # 관제 전용 계정 세션 절대 만료(시간)
  mfa:                               # 2단계 인증(TOTP, RFC 6238) — 로컬·AD·SSO 계정 공통, 복구 코드 8개
    enabled: true
    required_roles: [admin]          # 이 역할은 등록 전까지 화면 사용 제한(로그인 직후 등록 창) · 비우면 선택 등록
    issuer: VCF AIops                # 인증 앱에 표시되는 발급자
  oidc:                              # SSO(OpenID Connect, Authorization Code + PKCE) — Keycloak·Entra ID·Okta·ADFS
    enabled: false
    display_name: 사내 SSO            # 로그인 화면 버튼 이름
    issuer: https://login.corp.local/realms/vcf     # /.well-known/openid-configuration 을 제공하는 발급자 URL
    client_id: vcf-aiops
    client_secret: "${AIOPS_OIDC_SECRET}"           # 공개 클라이언트(PKCE 만)면 비움
    token_auth: post                 # post(client_secret_post) | basic(client_secret_basic)
    scopes: [openid, profile, email, groups]
    username_claim: preferred_username
    role_claim: groups               # 역할을 정할 클레임(배열) — Keycloak realm 역할은 realm_access.roles
    group_role_map:                  # 클레임 값 → 역할(가장 높은 역할 적용) · 매핑 없고 default_role 비면 로그인 거부
      aiops-admins: admin
      aiops-operators: operator
      aiops-auditors: auditor
      aiops-viewers: viewer
    default_role: ""                 # 매핑 없는 사용자의 기본 역할(viewer 등) · "" = 거부
    redirect_base: ""                # 역방향 프록시 뒤라면 외부 URL(https://aiops.corp.local) — 콜백 /api/auth/oidc/callback
    verify_tls: true
    ca_file: ""
  ldap:                              # AD/LDAP 로그인 — 그룹 → 역할 매핑(로그인마다 재계산)
    enabled: false
    servers: [ldaps://dc01.corp.local, ldaps://dc02.corp.local]   # 순서대로 장애 조치
    domain: CORP                     # 'CORP\홍길동' / '홍길동' 입력 모두 허용
    base_dn: "DC=corp,DC=local"
    use_ssl: true                    # LDAPS(636) 권장 — 평문 389 는 start_tls: true 와 함께
    start_tls: false
    verify_tls: true
    ca_file: certs/corp-root-ca.pem  # 사내 루트 CA(PEM)
    # bind_dn_template: "uid={username},ou=people,dc=corp,dc=local"   # AD 가 아닌 LDAP(OpenLDAP 등)일 때
    timeout: 8                       # 초 — 사용자 본인 자격증명으로 bind 후 본인 엔트리·그룹 조회(서비스 계정 불필요)
    nested_groups: true              # 중첩 그룹(LDAP_MATCHING_RULE_IN_CHAIN) 포함
    user_filter: "(&(objectClass=user)(sAMAccountName={username}))"
    group_role_map:                  # 위에서부터 높은 역할 우선 · 매핑 없으면 로그인 거부
      "CN=AIOps-Admins,OU=Groups,DC=corp,DC=local": admin
      "CN=AIOps-Operators,OU=Groups,DC=corp,DC=local": operator
      "CN=AIOps-Auditors,OU=Groups,DC=corp,DC=local": auditor
      "CN=AIOps-Viewers,OU=Groups,DC=corp,DC=local": viewer
perfwatch:                           # (2.25.0) 성능 상시 감시 — 자체 이력(perf.db)·계절성 이상 탐지·동료 이상치·감시 규칙(규칙은 화면에서)
  enabled: true
  interval: 300                      # 표본 간격(초)
  max_vms: 3000                      # 표본을 모을 VM 수 상한(전원 켠 VM)
  retention_5m_days: 3
  retention_1h_days: 42              # 6주 — 주 계절성은 3주 이상 쌓이면 사용
  max_alerts_per_cycle: 100
ingest_gate:                         # (2.22.1) 수집 일시정지 — 화면(플랫폼 상태) 값이 우선(DB 저장)
  auto: {enabled: true, queue_pct: 70, lag_ms: 800, read_ms: 3000, max_eps: 0, consecutive: 3, pause_minutes: 10, max_pause_minutes: 60, scope: top_sender, top_share: 30}
mobile:                              # (2.30.0) 안드로이드 앱 — 시스템·관리 › 모바일 앱 화면 값이 우선(DB 저장)
  enabled: true                      # 끄면 새 기기 연결·알림 확인을 모두 거부
  poll_minutes: 15                   # 앱이 새 알림을 물어보는 주기(15~720, 안드로이드 최소 15분)
  kinds: [update, alert, dr]         # 기본으로 보낼 알림: update(서버 업데이트)·alert(이상 징후)·dr(DR·백업)·perf(성능 감시)·system(시스템)
  min_sev: critical                  # 기본 최소 심각도(info·warning·error·critical) — 서버 업데이트 알림은 심각도와 무관
  max_devices_per_user: 5
  allow_without_access: false        # true: 외부 주소에서 기기 연결·알림 확인·앱 내려받기 3개 주소만 Cloudflare Access 검사 없이(기기 토큰 필요)
posture:                             # (2.22.0) 보안 상태 점검 — 시스템·관리 › 보안 점검
  enabled: true
  interval_hours: 6                  # 예약 점검 주기
  external_probe: true               # 인터넷 쪽에서 외부 이름 접속(Access 관문·엣지 인증서) 확인 — 출구가 없으면 '해당 없음'
  alert_min_severity: medium         # 새로 나빠진 항목 중 이 중요도 이상을 플랫폼 이벤트(알림)로
  retention_days: 180
  ignore: []                         # 예외 처리할 항목 ID(위험 수용) — 예: [backup, token_stale]
selfcheck:                           # 자가 점검(2.2)
  wal_max_mb: 256                    # WAL 이 넘으면 checkpoint(TRUNCATE)
  memory_warn_mb: 3072               # 프로세스 메모리 경고
  open_files_warn: 4000
  quick_check_hours: 24              # DB 무결성 점검 주기
  backup_stale_days: 2               # 백업이 이보다 오래되면 경고
  verify_backups: true               # 최신 백업 integrity_check
siem:                                # SIEM 전달 — CEF over syslog(UDP·TCP·TLS): Splunk·QRadar·ArcSight·Sentinel·Elastic
  enabled: false
  host: siem.corp.local
  port: 514                          # TLS 는 보통 6514
  protocol: udp                      # udp | tcp | tls
  verify_tls: true
  ca_file: ""
  audit: true                        # 감사 로그(인증·설정·조치·사용자)
  anomalies: true                    # 이상징후(min_severity 이상)
  min_severity: warning
  incidents: true                    # 인시던트 생성·상태 변경
audit:
  retention_days: 1825               # 감사로그 보존(5년) — 해시 체인으로 위·변조 검증

# ---------------------------------------------------------------- 인시던트 · ITSM · 조치
# ※ 아래부터 connectors 까지는 화면(운영 설정)에서도 편집 가능 — 화면 저장값(DB, 암호화)이 이 파일보다 우선
incidents:
  enabled: true
  min_severity: error                # 이 등급 이상 이상징후만 인시던트화
  correlation_window: 900            # 같은 클러스터(vCenter 토폴로지)/호스트에서 15분 내 → 같은 인시던트로 병합
  sla:                               # 분
    critical: {ack: 15, resolve: 240}
    error:    {ack: 30, resolve: 480}
    warning:  {ack: 120, resolve: 1440}
itsm:
  type: none                         # none | servicenow | webhook
  min_severity: critical             # 자동 티켓 생성 등급(그 외는 화면에서 'ITSM 등록')
  servicenow:
    instance: https://corp.service-now.com
    username: svc_aiops
    password: ${SNOW_PASS}           # 또는 token: ${SNOW_OAUTH_TOKEN}
    assignment_group: "VCF Operations"
    category: Infrastructure
    close_code: "Solved (Permanently)"
  # webhook: {url: https://itsm.corp.local/api/incident, headers: {Authorization: "Bearer ${ITSM_TOKEN}"}}
actions:                             # 조치 게이트 — 미리보기 → 차단 사유 → (L3↑) 4-eyes 승인 → 실행 직전 재측정
  enabled: true
  approval_min_level: 3              # L3(유지보수 모드·디스크 통합·서비스 재시작) 이상 관리자 승인
  approval_ttl_hours: 4
  admin_self_approve: true           # admin 역할만 본인 요청 승인 허용(감사로그 self_approved) — false 면 모두 4-eyes
  deny_environments: [prod]          # 커넥터 environment 가 여기에 있으면 쓰기 조치 차단
  task_timeout: 900

# ---------------------------------------------------------------- 리포트 · 백업 · 메트릭
reports:
  daily:  {enabled: true, time: "08:30", recipients: [vcf-ops@corp.local]}
  weekly: {enabled: true, weekday: 0, time: "08:40", recipients: [vcf-ops@corp.local, it-mgmt@corp.local]}
  monthly: {enabled: true, day: 1, time: "08:50", recipients: [it-mgmt@corp.local]}   # 지난달 전체 — 정산·용량 예측·VM 적정화·보안 판독 포함(2.0)
  ai_summary: true
  extended: true                     # 주간·월간·기간 리포트에 정산·용량·적정화·보안 판독 절 추가
  keep_days: 180
backup:
  enabled: true
  time: "02:30"                      # SQLite 온라인 백업(서비스 중단 없음)
  keep: 14
  dir: data/backup
web_search:                          # (2.7) AI 질의 웹 검색 근거 — 기본 꺼짐(폐쇄망). 운영 설정 › 웹 검색에서도 설정
  enabled: false
  provider: searxng                  # searxng(사내 설치, 키 불필요 — settings.yml search.formats 에 json) | brave | tavily
  url: ""                            # SearXNG 주소 예) http://searxng.corp:8080
  api_key: ""                        # Brave(X-Subscription-Token)·Tavily(Bearer)
  proxy: ""                          # 예) http://proxy.corp:3128
  mode: auto                         # auto(사내 KB 근거 < min_kb_refs 또는 화면에서 켤 때) | always | manual
  min_kb_refs: 2
  fetch_pages: 3                     # 본문을 읽을 상위 페이지(공개 주소만)
  prefer_domains: [knowledge.broadcom.com, techdocs.broadcom.com, docs.vmware.com, community.broadcom.com, williamlam.com]

# 지원 요청(SR, 2.11) — 공유 링크 URL 은 server.public_url 기준(비우면 접속한 주소). 연락처·Site ID 등은 웹 화면 '기본 정보'에서 저장
vks_observe:                         # VKS 구성도 변경 이력(2.10)
  retention_days: 30                 # vks_activity 보관 기간

readiness:                           # 하드웨어 준비도(2.14) — 화면 '설정·HCL' 값이 우선
  schedule_hours: 0                  # 등록된 BMC 예약 스캔 주기(0 = 끔)
  concurrency: 4                     # 동시 스캔 대수
  host_timeout: 300                  # 호스트당 제한 시간(초)
  sel_days: 30                       # 하드웨어 이벤트 평가 기간(일)

license:                             # 라이선스 관리(2.16) — 화면 '설정' 값이 우선
  schedule_hours: 24                 # vCenter 커넥터 라이선스 예약 수집(0 = 끔)
  expiry_warn_days: 90               # 만료 경고
  usage_report_days: 150             # VCF 9 사용량 보고 경과 경고(롤링 180일 전)
  vcfops_usage_api: false            # VCF Ops 내부(비지원) API 로 사용량 보고서 받기 — 기본 꺼짐(파일 업로드 권장)

rvtools:                             # RVTools 분석(2.15) — 원본 파일은 저장하지 않음
  max_mb: 100                        # 업로드 상한(MB)
  retention: 20                      # 보관할 분석 건수(오래된 것부터 삭제)

cloudcost:                           # 클라우드 비용 비교(2.13) — 원가·단가는 웹 화면에서 입력
  iops_interval: 3600                # VM IOPS 수집 주기(초)
  iops_retention_days: 90            # cc_iops 보관 기간

vm_activity:                         # VM 액티비티 위험 신호 규칙 초기값(2.5) — 웹 화면 '위험 신호 규칙'에서 저장한 값이 우선
  tz: Asia/Seoul
  business_hours: "09:00-18:00"      # 이 시간 밖·업무 요일 외·휴일의 사람 작업 = '업무 외'
  business_days: [1, 2, 3, 4, 5]     # 1=월 … 7=일
  holidays: []                       # ["2026-10-09", "2026-12-25"]
  bulk_delete_count: 5               # 한 사용자가 bulk_delete_minutes 안에 N대 이상 삭제 → 위험 이상징후
  bulk_delete_minutes: 10
  bulk_power_off_count: 10
  bulk_power_off_minutes: 10
  protected: []                      # ["*-prod-*", "corebank-*"] 삭제=위험·전원 끔/스냅샷 되돌림=오류·구성/이름 변경=경고
  short_lived_hours: 24              # 생성 후 이 시간 안에 삭제 = 단명 VM(0=끔)
  change_window_check: false         # (2.6) true = 유지보수 창 밖의 사람 변경을 '변경 창 밖'(위험 신호)으로 표시. 창 안 변경은 항상 '변경 창 안'
  pingpong_count: 4                  # (2.6) 한 VM 이 pingpong_minutes 안에 N회 이상 이동 → '반복 이동' 경고 이상징후(0=끔)
  pingpong_minutes: 60
  retention_days: 400                # (2.6) VM 액티비티 보관(최소 90일)
  # service_accounts: ["*vpxd-extension*", "*svc-*"]   # 업무 외·대량 판정 제외(기본값은 vCenter 내부 계정 패턴)

noc:                                 # 통합 관제 화면(/noc)
  window_minutes: 30                 # 슬롯 상태 판정 창 — 이 시간 내 미확인 이상만 집계
  escalate_minutes: 15               # 미확인 위험이 이 시간을 넘기면 알림 채널로 재발송(0=끔)
  ai_brief: true                     # 상황 브리핑(Gemma 4 31B) — false 면 규칙 기반 요약
  brief_ttl_seconds: 300
  stale_minutes: 10                  # 슬롯 데이터(로그·폴링 성공)가 이 시간 넘게 없으면 '데이터 지연'으로 주의 표시(0=끔)
  # slots:                           # 비우면 기본 4슬롯. 바꿀 때 예:
  #   - {id: vc,  name: vCenter, scope: "vCenter 와 ESXi 호스트", sources: [vcenter, esxi], types: [vcenter]}
  #   - {id: nsx, name: NSX,     scope: "NSX Manager 와 Edge",   sources: [nsx, nsx-edge], types: [nsx]}
  #   - {id: avi, name: NSX ALB, scope: "Avi",                   sources: [avi],           types: [avi]}
  #   - {id: vks, name: VKS,     scope: "Supervisor 와 워크로드", sources: [vks, vks-supervisor], types: [vks]}
metrics:                             # GET /metrics (Prometheus) — 허용 IP 또는 API 토큰(scope=metrics)
  enabled: true
  allow_ips: [127.0.0.1]

# ---------------------------------------------------------------- 폴링 커넥터
connectors:
  # --- 네트워크(2.2) — 로그는 장비에서 'logging host <AIops>' 로 514/udp, 아래 커넥터는 상태·LLDP/CDP·MLAG/vPC·BGP(읽기 전용)
  # - {name: dc1-spine-01, type: arista, host: 10.0.0.11, username: aiops-ro, password: "${ARISTA_PW}", role: spine}   # eAPI(https://<장비>/command-api)
  #   (2.4) 구성 수집: config: true · config_interval: 900 — running-config(비밀값 가림)·포트 사용 구분·구성 변경 감지
  # - {name: dc1-leaf-03, type: cisco, host: 10.0.0.15, username: aiops-ro, password: "${NXOS_PW}"}                      # platform auto: NX-API → RESTCONF → SNMP
  # - {name: c9300-1, type: cisco, platform: iosxe, host: 10.0.0.21, username: aiops-ro, password: "${IOSXE_PW}"}
  # - {name: old-2960, type: snmp-switch, host: 10.0.0.31, community: "${SNMP_RO}", role: access}                           # SNMP v2c(또는 snmp_user·auth_key·priv_key)
  - name: vc-mgmt
    type: vcenter
    host: vc-mgmt.vcf.lab
    username: administrator@vsphere.local
    password: ${VC_MGMT_PASS}
    interval: 15
    environment: prod                # 조치 정책(actions.deny_environments) 판정용 라벨
    # host_logs: [hostd, vmkernel, vpxa]   # ESXi 로그 직접 수집(BrowseDiagnosticLog, Global.Diagnostics 권한)
    # (2.30.0) 응답 없는 vCenter 가 포털 전체를 멈추지 않게 하는 상한 — 기본값으로 충분, 아주 큰 환경에서만 조정
    # soap_timeout: 120              # pyVmomi 소켓 응답 대기(초)
    # lock_timeout: 45               # 무거운 수집 중 화면 요청이 기다리는 최대 시간(초) — 넘으면 '수집 중' 오류
    # heavy_timeout: 900             # 토폴로지·SLI·점검·백업 수집 한 번의 상한(초) — 이벤트 읽기와 따로 돎
    # heavy_retry: 60                # 무거운 수집 실패 후 재시도 간격(초)
    # worker_threads: 8              # 이 커넥터 전용 작업 스레드 수
    # net_hint_interval: 900         # 2.3 포트맵 — ESXi vmnic LLDP/CDP(QueryNetworkHint) 조회 간격(초), 0 = 끔
    # net_hint_max_hosts: 300
    sli:                             # 성능 SLI(Isvara 4대 경합 지표) — 기본 켜짐, 실시간 카운터(20초) 최근 5분의 p99
      enabled: true
      interval: 300                  # 계산 주기(초)
      thresholds: {cpu_ready: 2.5, mem_latency: 1.0, disk_latency: 10, net_dropped: 0}   # isvara.io 'Defined good'
      drop_budget: 100               # dropped packets 점수 규칙: 0→100, 1→75, 100→50, 300→0 (5분 합 기준)
      alert_band: orange             # 이 밴드 이하로 떨어지면 '성능 SLI 위반' 이벤트(orange|red|yellow)
      failover_hosts: 1              # 페일오버 여유 판정 N(HA 승인 제어 failoverLevel 이 있으면 그 값)
      max_vms: 5000                  # 대상 VM 상한(전원 켠 VM)

  - name: vc-wld01
    type: vcenter
    host: vc-wld01.vcf.lab
    username: administrator@vsphere.local
    password: ${VC_WLD01_PASS}

  - name: sddc-manager
    type: sddc
    host: sddc-manager.vcf.lab
    username: administrator@vsphere.local
    password: ${SDDC_PASS}

  - name: nsx-mgmt
    type: nsx
    host: nsx-mgmt.vcf.lab          # VIP
    username: admin
    password: ${NSX_PASS}
    # vpc: true                      # 2.4 NSX 프로젝트·VPC·서브넷 수집
    # bgp: true                      # 2.3 T0 BGP(Edge ↔ 물리 스위치) 수집 — 구성도·BGP 피어링·세션 이벤트
    # bgp_interval: 120

  - name: vcf-ops
    type: vcfops
    host: vcf-ops.vcf.lab
    username: admin
    password: ${VCFOPS_PASS}
    # auth_source: vIDMAuthSource
    # token_scheme: vRealizeOpsToken   # Aria Operations 8.x 이하

  - name: vcf-logs
    type: vcflogs
    host: vcf-logs.vcf.lab           # 포트 9543 자동
    username: admin
    password: ${VCFLOGS_PASS}
    provider: Local
    interval: 10
    # constraint: "text/CONTAINS error"   # 대량 환경에서 서버측 필터

  - name: vcf-automation
    type: vcfa
    host: vcfa.vcf.lab
    mode: provider                   # provider | vmapps | aria8
    username: admin                  # provider 모드는 admin@System 으로 로그인
    password: ${VCFA_PASS}
    api_version: "9.0.0"             # VCFA 9.1 은 "9.1.0"
    # mode: vmapps / org: my-org / api_token: ${VCFA_REFRESH_TOKEN}

  - name: srm-site-a
    type: srm
    host: srm-a.vcf.lab
    username: administrator@vsphere.local
    password: ${SRM_PASS}
    remote_username: administrator@vsphere.local   # 원격 사이트 vCenter(복구 계획 조회용)
    remote_password: ${SRM_REMOTE_PASS}
    interval: 60

  - name: nsx-alb
    type: nsx-alb                    # = avi
    host: avi-ctrl.vcf.lab
    username: admin
    password: ${AVI_PASS}
    # api_version: "31.1.1"          # 미지정 시 /login 응답 버전 사용
    # events: true                   # 이벤트 로그(/api/analytics/logs?type=2) 수집

  - name: supervisor-mgmt            # VKS Supervisor — vSphere SSO 로 /wcp/login
    type: vks
    role: supervisor
    host: 10.10.50.10:6443           # Supervisor 컨트롤 플레인 VIP (kube-apiserver)
    supervisor: 10.10.50.10          # /wcp/login 주소(443)
    auth: vsphere
    username: svc-aiops@vsphere.local
    password: ${SUPERVISOR_PASS}
    cluster_name: supervisor-mgmt
    namespaces: [prod-ns, dev-ns]    # 클러스터 범위 권한이 없을 때 순회할 vSphere 네임스페이스
    interval: 30                     # 이벤트 watch 주기
    status_interval: 60              # 노드·파드·Cluster API 점검

  - name: wld-bank01                 # VKS 워크로드 클러스터 — deploy/vks/vcf-aiops-reader.yaml 의 토큰
    type: vks
    role: workload
    host: 10.10.60.20:6443
    auth: token
    token: ${WLD_BANK01_TOKEN}
    cluster_name: wld-bank01
    # auth: vsphere / supervisor: 10.10.50.10 / guest_cluster_name: wld-bank01 / guest_cluster_namespace: prod-ns
    # topology_interval: 300        # 구성도용 목록 주기(초) — 변경 이력(롤아웃·스케일 등) 비교 주기이기도 함

  - name: ilo                        # 물리 서버 BMC — HPE iLO 5/6/7 (Redfish). 서버별 ESXi 이름을 붙이면 관제 타일이 합쳐짐
    type: ilo
    username: monitor                # 읽기 권한 계정. 이벤트 구독 생성이 권한 부족(403)이면 커넥터 시험에 표시되고 poll 로 동작
    password: ${ILO_PASS}
    interval: 60                     # 로그 보완 조회·구독 점검 주기
    events: auto                     # auto | push(BMC→AIOps HTTPS) | sse(AIOps→BMC 상시 연결) | poll
    inventory_interval: 120          # 팬·온도·PSU·이중화·드라이브·CPU·메모리 상태(변화 시에만 이벤트)
    reconcile_interval: 300          # 실시간 사용 중에도 로그 서비스(IML·IEL)를 이 주기로 대조해 누락 보완
    hosts:
      - {host: ilo-esx01.vcf.lab, esxi_host: esx01.vcf.lab}
      - {host: ilo-esx02.vcf.lab, esxi_host: esx02.vcf.lab}
      - {host: ilo-db-bm01.vcf.lab, name: oracle-bm01}      # ESXi 가 아닌 물리 서버(베어메탈 DB 등)
    # log_services: [IML, IEL]       # 비우면 자동 탐색한 전체

  # - name: idrac                    # Dell iDRAC 9/10 — 펌웨어 4.00 이상은 SSE 로 실시간(방화벽 BMC→AIOps 불필요)
  #   type: idrac
  #   events: sse
  #   hosts: [{host: idrac-esx05.vcf.lab, esxi_host: esx05.vcf.lab}]
  #   username: root
  #   password: ${IDRAC_PASS}

# 2.21.0 NSX 세그먼트 트래픽 — 5분마다 세그먼트별 합계 저장(추세), vNIC 목록 캐시
segtraffic:
  enabled: true
  interval: 300          # 세그먼트 합계 저장 간격(초, 최소 60)
  retention_days: 14     # 저장 기간
  inventory_ttl: 300     # vCenter vNIC·세그먼트 목록 캐시(초)
