  <rect class="box" x="316" y="380" width="198" height="72" rx="3"/>
  <text class="bt" x="328" y="402">Syslog 수신기</text>
  <text class="bs" x="328" y="420">UDP·TCP 514 · TLS 6514 · RFC5424</text>
  <text class="bs" x="328" y="438">앱·SD(comp)·호스트로 제품 분류</text>
  <rect class="box" x="316" y="478" width="198" height="90" rx="3"/>
  <text class="bt" x="328" y="500">SNMP 트랩 수신기</text>
  <text class="bs" x="328" y="518">UDP 162 · v1 / v2c / v3(USM)</text>
  <text class="bs" x="328" y="536">VMware VC/ENV/VMINFO MIB</text>
  <text class="bs" x="328" y="554">벤더 enterprise 분류 · oid_map</text>
  <rect class="box" x="316" y="596" width="198" height="56" rx="3"/>
  <text class="bt" x="328" y="618">HTTP 수집</text>
  <text class="bs" x="328" y="636">POST /api/ingest (토큰)</text>

