  <!-- ② 수집 계층 -->
  <rect class="zone" x="300" y="74" width="230" height="806" rx="4"/>
  <text class="zt" x="316" y="100">② 수집 계층</text>
  <text class="zs" x="316" y="117">Pull · Push 동시 지원</text>
  <rect class="box" x="316" y="140" width="198" height="200" rx="3"/>
  <text class="bt" x="328" y="162">API 폴링 커넥터</text>
  <text class="bs" x="328" y="182">• vSphere SOAP + REST</text>
  <text class="bs" x="328" y="200">• SDDC · NSX · Ops · Logs</text>
  <text class="bs" x="328" y="218">• VCFA · SRM · NSX ALB</text>
  <text class="bs" x="328" y="236">• Redfish (BMC) · VKS(K8s watch)</text>
  <text class="bs" x="328" y="258">세션 재인증 · 지수 백오프</text>
