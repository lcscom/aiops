  <text class="bt" x="600" y="374">이상징후 생성 · 지문 병합</text>
  <text class="bs" x="600" y="392">score ≥ llm_threshold · 동일 지문 재발은 카운트</text>
  <rect class="eng" x="584" y="438" width="372" height="96" rx="3"/>
  <text class="bt" x="600" y="460">AI 판정 워커 (배치)</text>
  <text class="bs" x="600" y="480">① 활성 RAG 팩 하이브리드 검색 (소스별 applies_to)</text>
  <text class="bs" x="600" y="498">② 후보 + 직전 로그 + 근거 문서[R#] → Gemma 4 31B</text>
  <text class="bs" x="600" y="516">③ JSON: 요약·원인·영향·조치·근거·신뢰도</text>
